version: "3.8"

services:
  tu-mayordomo-app:
    container_name: tu-mayordomo-app
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3050:80" # Expuesto a localhost por protocolo, libre de conflictos
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - shared-proxy

networks:
  shared-proxy:
    external: true
